name: Main branch checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ordinary:
    name: Complete ordinary verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Restore Nix toolchain
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-compiler-${{ hashFiles('flake.lock', 'flake.nix', 'jazz.cabal') }}

      - name: Prepare Nix toolchain
        run: nix develop --command true

      # Save before compiler checks so a test failure does not discard the toolchain.
      - name: Save Nix toolchain
        if: steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}

      - name: Cache Cabal dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-v2-${{ hashFiles('flake.lock', 'jazz.cabal', 'cabal.project', 'flake.nix') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cabal-v2-${{ hashFiles('flake.lock', 'jazz.cabal', 'cabal.project', 'flake.nix') }}-

      - name: Remove cached test logs
        run: |
          if [[ -d dist-newstyle ]]; then
            find dist-newstyle -type f -name '*.log' -delete
          fi

      - name: Run complete ordinary verification
        id: ordinary
        env:
          JAZZ_DIFF_BASE: ${{ github.event.before }}
        run: nix develop --command bash scripts/ci/main-functional.sh

      - name: Collect ordinary test logs
        if: failure() && steps.ordinary.outcome == 'failure'
        run: |
          mkdir -p artifacts/ordinary-test-logs
          if [[ -d dist-newstyle ]]; then
            find dist-newstyle -type f -name '*.log' -exec cp --parents {} artifacts/ordinary-test-logs \;
          fi

      - name: Upload ordinary test logs
        if: failure() && steps.ordinary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordinary-test-logs-${{ github.run_id }}
          path: artifacts/ordinary-test-logs
          if-no-files-found: ignore
          retention-days: 7
