name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "editors/vscode-jazz/syntaxes/jazz.tmLanguage.json"
      - "examples/functions/factorial.jz"
      - "scripts/example-cases.tsv"
      - "scripts/check-website.sh"
      - "scripts/check-docs-pages-workflow.py"
      - "scripts/check-website-boundary.py"
      - "scripts/check-public-docs.py"
      - "scripts/example_cases.py"
      - "scripts/markdown_targets.py"
      - "scripts/markdown_visibility.py"
      - "scripts/public-doc-fragments.tsv"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # Checkout reads the source used to build the site.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Check brand assets
        run: pnpm run test:brand
        working-directory: website

      - name: Check website experience
        run: pnpm run test:experience
        working-directory: website

      - name: Type-check website
        run: pnpm run typecheck
        working-directory: website

      - name: Check Pages workflow contract
        run: python3 scripts/check-docs-pages-workflow.py

      - name: Check public documentation
        run: python3 scripts/check-public-docs.py

      - name: Build website
        run: pnpm run build
        working-directory: website

      - name: Check generated publication boundary
        run: python3 scripts/check-website-boundary.py --build-directory website/build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    permissions:
      pages: write # Publish the checked Pages artifact.
      id-token: write # Authenticate the deployment through OIDC.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
