type-class-roots = false
unused-types = true
root-modules = []

# Structural data contracts survive even when one executable does not exercise
# every instance: comparisons/debugging, generic deep evaluation, catalog
# enumeration and lawful typed traversals are intentionally supported APIs.
# This also roots these instances on otherwise-unused types; it does not root
# arbitrary classes, functions or whole compiler modules.
root-instances = [
  # Persisted benchmark metadata readers are part of the artifact format API.
  { instance = '^FromJSON (BenchmarkBuildMode|BenchmarkTimeMode|BenchmarkEnvironment)$' },
  { instance = '^FromJSON value => FromJSON \(EnvironmentFact value\)$' },
  { class = '\.(Eq|Ord|Show|Generic|NFData|Enum|Bounded|Functor|Foldable|Traversable)$' },
  # Literal construction interfaces used by test/tooling clients.
  { instance = '^IsString (Identifier|UnresolvedName)$' },
  # Megaparsec stream/error interfaces, including its optional default renderer.
  { instance = '^ShowErrorComponent (LexerError|ParserError)$' },
  { instance = '^(VisualStream|TraversableStream) TokenStream$' },
  # RuntimePlan's composition contract is retained and covered by law tests.
  { instance = '^(Semigroup|Monoid) RuntimePlan$' },
]
