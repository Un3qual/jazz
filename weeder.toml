# Reviewed GHC 9.14 baseline; keep new unreachable declarations visible.
roots = [
  '^Main\.main$',
  # Cabal-generated package metadata is not maintained Haskell source.
  '^Paths_jazz\.',
  # Shared benchmark driver compiled into both the benchmark and its tests.
  '^Jazz\.Benchmark\.Stages\.runBenchmarkMain$',
  # Shared benchmark/corpus API; each Cabal component uses only a subset.
  # benchmark/Jazz/Benchmark/Metadata.hs
  '^Jazz\.Benchmark\.Metadata\.(BenchmarkArtifactPaths|BenchmarkBuildMode|BenchmarkEnvironment|BenchmarkEnvironmentCapture|BenchmarkTimeMode|CompatibilityDecision|CompatibilityField|CompatibilityMismatch|CompatibilityPolicy|EnvironmentFact|benchmarkArtifactPaths|benchmarkBuildModeForProfiling|benchmarkEnvironmentJson|benchmarkRunIdentity|benchmarkTimeModeFromArguments|captureBenchmarkEnvironment|checkBenchmarkCompatibility|classifyProcessFact|createBenchmarkArtifactDirectory|writeBenchmarkEnvironment)$',
  # Shared benchmark inspection API; component usage differs.
  '^Jazz\.Benchmark\.ScaleCases\.compilerScaleCaseSourceCount$',
  # Shared benchmark/corpus API; each Cabal component uses only a subset.
  # benchmark/Jazz/Benchmark/Stages.hs
  '^Jazz\.Benchmark\.Stages\.(runBenchmarkMain|runBenchmarkMainWithArguments|runBenchmarkMainWithEnvironmentCapture)$',
  # Shared benchmark/corpus API; each Cabal component uses only a subset.
  # program-support/Jazz/ProgramCorpus/Manifest.hs
  '^Jazz\.ProgramCorpus\.Manifest\.(loadProgramCorpusAt|loadProgramCorpusAtWithManifestReader|programCaseById)$',
  # Shared benchmark/corpus API; each Cabal component uses only a subset.
  # program-support/Jazz/ProgramCorpus/Runner.hs
  '^Jazz\.ProgramCorpus\.Runner\.(loadProgramCaseEntrySource|prepareProgramCase|programCaseBudgetViolations|runProgramCaseObserved)$',
  # Shared benchmark/corpus API; each Cabal component uses only a subset.
  # program-support/Jazz/ProgramCorpus/Types.hs
  '^Jazz\.ProgramCorpus\.Types\.(ProgramBudgetViolation)$',
  # Benchmark forcing and profiling tooling API.
  # src/Jazz/Compiler/Profiling.hs
  '^Jazz\.Compiler\.Profiling\.(compilerProfilingEnabled)$',
  # Shared resolved runtime fixtures are used by three separate components.
  '^Jazz\.Compiler\.Semantics\.Runtime\.ResolvedFixture\.(observeFixture|evaluateFixture|evaluateFixtureWithHost|fixtureDeclarations)$',
  # Shared test-support API; each Cabal component uses only a subset.
  # test/Jazz/Compiler/Parser/TestSupport.hs
  '^Jazz\.Compiler\.Parser\.TestSupport\.(surfaceExprAt|surfacePatternAt)$',
  # Shared test-support API; each Cabal component uses only a subset.
  # test/Jazz/Compiler/Semantics/Runtime/Fixtures.hs
  '^Jazz\.Compiler\.Semantics\.Runtime\.Fixtures\.(caseArm|classMethodSignature|dataConstructor|expressionBinary|expressionConstrainedAs|expressionConstructor|expressionIf|expressionLambda|expressionOperatorValue|expressionPatternCase|expressionQualifiedMethod|expressionSectionLeft|expressionSectionRight|expressionTuple|expressionTypeApplication|fixtureResolvedTypeName|fixtureTypeVariable|fixtureValueName|implMethod|patternConstructor|patternLiteral|patternTuple|patternVariable|patternWildcard|statementClass|statementData|statementImpl|statementLet|statementSignature)$',
  # Shared test-support API; each Cabal component uses only a subset.
  # Shared test-support API; each Cabal component uses only a subset.
  # test/Jazz/TestCore.hs
  '^Jazz\.TestCore\.(assertLoweredCoreEqual|loweredApply|loweredAsPattern|loweredBinary|loweredBlock|loweredCaseArm|loweredClass|loweredClassMethodSignature|loweredConsListPattern|loweredConstructor|loweredConstructorAt|loweredConstructorPattern|loweredData|loweredExpression|loweredIf|loweredImpl|loweredImplMethod|loweredImport|loweredLambda|loweredLet|loweredList|loweredListPattern|loweredLiteral|loweredLiteralPattern|loweredModule|loweredOperatorValue|loweredOrPattern|loweredPatternCase|loweredSectionLeft|loweredSectionRight|loweredSignature|loweredTuple|loweredTuplePattern|loweredTypeApplication|loweredVariable|loweredVariablePattern|loweredWildcardPattern|parseSurfaceProgramPoints)$',
  # Shared test-support API; each Cabal component uses only a subset.
  # test/Jazz/TestHarness.hs
  '^Jazz\.TestHarness\.(assertContains|assertDiagnosticContains|assertEqual|assertLeftContains|assertLeftDiagnosticCodeAndContains|assertLeftDiagnosticContains|assertRight|assertSingleDiagnosticCode|assertSingleDiagnosticContains|assertSingleDiagnosticPrimaryStart|assertSingleDiagnosticRelatedStart|assertSingleDiagnosticSubject|assertSingleErrorContains)$',
  # Shared test-support API; each Cabal component uses only a subset.
  # test/Jazz/TestSource.hs
  '^Jazz\.TestSource\.(readCheckedInJazzModuleSource|readCheckedInJazzSource|readCheckedInJazzTestFixture)$',
]

type-class-roots = false
unused-types = true
root-modules = []

# Retain structural contracts only for the named migration-baseline types.
# Weeder matches module against source paths. Instance patterns match the entire
# result head, so a retained type in a constraint cannot root a new wrapper.
# New types and source files require review before entering this baseline.
root-instances = [
  # RFC 0019 retains the shared Kind structural and traversal interfaces.
  { module = '^src/Jazz/Compiler/TypeRepresentation\.hs$', instance = '(^|=> )(Eq|Ord|Show|Generic|NFData|Functor|Foldable|Traversable) (\(Kind variable\)|Kind)$' },
  # Persisted benchmark metadata readers are part of the artifact format API.
  { instance = '^FromJSON (BenchmarkBuildMode|BenchmarkTimeMode|BenchmarkEnvironment)$' },
  { instance = '^FromJSON value => FromJSON \(EnvironmentFact value\)$' },
  { module = '^benchmark/Jazz/Benchmark/Metadata\.hs$', instance = '(^|=> )(Eq|Ord|Show|Generic|NFData|Enum|Bounded|Functor|Foldable|Traversable) (\(EnvironmentFact value\)|BenchmarkArtifactPaths|BenchmarkBuildMode|BenchmarkEnvironment|BenchmarkEnvironmentCapture|BenchmarkTimeMode|CompatibilityDecision|CompatibilityField|CompatibilityMismatch|CompatibilityPolicy)$' },
